name: Apply full audit patch

on:
  push:
    branches: [audit/full-verification]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[audit-bootstrap]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/apply_audit_fixes.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply full-game audit fixes and regression suite"
          git push origin HEAD:audit/full-verification
